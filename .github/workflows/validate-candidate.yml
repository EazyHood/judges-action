name: Validate judges-action 2745
on:
  push:
    branches: [validate-2745-20261112]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 91584b93ec8c52e445c07244dfdf0ea99b6281b1
          persist-credentials: false
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: sudo apt-get update && sudo apt-get install -y parallel
      - name: Run the focused and complete checks
        env:
          RAKE_RUN: 'true'
        run: |
          set -eu
          bundle exec ruby -Itest -e 'ARGV << "--no-cov"; require "./test/judges/test-revival-interval.rb"; require "./test/judges/test-revive-user.rb"; require "./test/judges/test-revive-repository.rb"; ARGV.delete("--no-cov")'
          bundle exec rake test judges rubocop
