name: Validate judges-action 2483
on:
  push:
    branches: [validate-2483-20261113-v2]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a243d50465139fd21942b760823a642f6def5a17
          persist-credentials: false
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: sudo apt-get update && sudo apt-get install -y parallel
      - name: Focused regression tests
        env:
          RAKE_RUN: 'true'
        run: bundle exec ruby -Itest -e 'ARGV << "--no-cov"; require "./test/judges/test-exhausted-quota.rb"; ARGV.delete("--no-cov")'
      - name: Independent removal mutants
        env:
          RAKE_RUN: 'true'
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess
          command = ['bundle', 'exec', 'ruby', '-Itest', '-e', 'ARGV << "--no-cov"; require "./test/judges/test-exhausted-quota.rb"; ARGV.delete("--no-cov")']
          mutations = [('eliminate-ghosts', 'next if Fbe.octo.off_quota?'), ('erase-repository', 'next if Fbe.octo.off_quota?'), ('find-all-issues', 'next if Fbe.octo.off_quota?')]
          for judge, needle in mutations:
              path = pathlib.Path(f'judges/{judge}/{judge}.rb')
              original = path.read_text()
              assert original.count(needle) == 1, (judge, original.count(needle))
              try:
                  path.write_text(original.replace(needle, 'nil'))
                  result = subprocess.run(command, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  print(f'MUTANT {judge} exit={result.returncode}', flush=True)
                  print(result.stdout, flush=True)
                  assert result.returncode != 0, f'Surviving mutant {judge}'
                  assert re.search(r'[1-9]\d* failures, 0 errors', result.stdout), f'Invalid failure {judge}'
              finally:
                  path.write_text(original)
          print(f'Killed {len(mutations)}/{len(mutations)} mutants with assertion failures')
          PY
      - name: Complete test and lint suite
        env:
          RAKE_RUN: 'true'
        run: bundle exec rake test judges rubocop
